<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Booking Confirmed | Shri Radha Travels</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Poppins,Arial,sans-serif;
}

body{
background:#0b0f19;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
padding:20px;
}

.box{
background:#111827;
border:2px solid #d4af37;
border-radius:20px;
padding:35px 25px;
max-width:420px;
width:100%;
text-align:center;
box-shadow:0 15px 40px rgba(0,0,0,.4);
}

.tick{
width:90px;
height:90px;
margin:auto;
background:#22c55e;
border-radius:50%;
display:flex;
justify-content:center;
align-items:center;
font-size:45px;
color:white;
margin-bottom:20px;
}

h1{
color:#fff;
margin-bottom:10px;
}

p{
color:#d1d5db;
line-height:1.7;
margin-bottom:25px;
}

a{
display:inline-block;
padding:12px 28px;
background:#d4af37;
color:#000;
text-decoration:none;
font-weight:bold;
border-radius:8px;
}
</style>

</head>
<body>

<div class="box">

<div class="tick">✓</div>

<h1>Booking Request Received</h1>

<p>
Thank you for choosing Shri Radha Travels.
Your booking request has been submitted successfully.
Our team will contact you shortly.
</p>

<a href="/">Back To Home</a>

</div>

</body>
</html>
