<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Round Trip Taxi Service | Shri Radha Travels</title>
    <meta name="description" content="Book Outstation Round Trip Cabs with Shri Radha Travels. Best rates, verified drivers & luxury cars.">
    
    <!-- Google Fonts & Font Awesome -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background-color: #0b0f19;
            color: #ffffff;
            min-height: 100vh;
            padding-bottom: 60px;
        }

        /* Top Navigation Header */
        .top-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 15px 20px;
            background: rgba(11, 15, 25, 0.95);
            border-bottom: 1px solid rgba(251, 191, 36, 0.2);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: #fbbf24;
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
        }

        .brand-logo {
            color: #ffffff;
            font-family: 'Cinzel', serif;
            font-size: 16px;
            font-weight: 700;
        }
        .brand-logo span { color: #fbbf24; }

        /* Page Container */
        .container {
            max-width: 600px;
            margin: 0 auto;
            padding: 24px 16px;
        }

        /* Hero Header Box */
        .hero-card {
            background: linear-gradient(135deg, rgba(30, 58, 138, 0.4) 0%, rgba(15, 23, 42, 0.8) 100%);
            border: 1.5px solid rgba(251, 191, 36, 0.4);
            border-radius: 16px;
            padding: 24px 20px;
            text-align: center;
            margin-bottom: 24px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .hero-badge {
            display: inline-block;
            background: rgba(251, 191, 36, 0.15);
            color: #fbbf24;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 2.5px;
            padding: 6px 14px;
            border-radius: 20px;
            text-transform: uppercase;
            margin-bottom: 12px;
            border: 1px solid rgba(251, 191, 36, 0.3);
        }

        .hero-title {
            font-size: 24px;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 10px;
        }
        .hero-title span { color: #fbbf24; }

        .hero-desc {
            font-size: 13px;
            color: #94a3b8;
            line-height: 1.6;
        }

        /* Features Bullet Points */
        .features-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 24px;
        }

        .feature-box {
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 12px;
            padding: 12px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .feature-box i {
            color: #fbbf24;
            font-size: 16px;
        }

        .feature-box span {
            font-size: 12px;
            color: #e2e8f0;
            font-weight: 500;
        }

        /* Booking Form Card */
        .form-card {
            background: rgba(255, 255, 255, 0.04);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1.5px solid rgba(251, 191, 36, 0.5);
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.4);
        }

        .form-title {
            font-size: 18px;
            font-weight: 700;
            color: #ffffff;
            text-align: center;
            margin-bottom: 16px;
        }

        .input-group {
            margin-bottom: 12px;
        }

        .input-group input, .input-group select {
            width: 100%;
            padding: 12px 14px;
            border-radius: 10px;
            border: 1px solid rgba(251, 191, 36, 0.4);
            background: rgba(15, 23, 42, 0.8);
            color: #ffffff;
            font-size: 14px;
            outline: none;
            transition: all 0.3s ease;
        }

        .input-group input:focus, .input-group select:focus {
            border-color: #fbbf24;
            background: #131b2e;
            box-shadow: 0 0 10px rgba(251, 191, 36, 0.2);
        }

        .submit-btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #fbbf24 0%, #d97706 100%);
            color: #0b0f19;
            border: none;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            margin-top: 6px;
            box-shadow: 0 4px 15px rgba(251, 191, 36, 0.3);
        }

        /* Floating Buttons Stack */
        .floating-stack {
            position: fixed;
            bottom: 20px;
            right: 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            z-index: 1000;
        }

        .float-btn {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            text-decoration: none;
            font-size: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
        }
        .btn-wa { background: #25D366; }
        .btn-call { background: #eab308; }
    </style>
</head>
<body>

    <!-- Header Navigation -->
    <header class="top-header">
        <a href="index.html" class="back-link">
            <i class="fas fa-arrow-left"></i> Back to Home
        </a>
        <div class="brand-logo">Shri Radha <span>Travels</span></div>
    </header>

    <div class="container">
        <!-- Hero Header -->
        <div class="hero-card">
            <span class="hero-badge">OUTSTATION CAB SERVICE</span>
            <h1 class="hero-title">Round Trip <span>Service</span></h1>
            <p class="hero-desc">Enjoy multi-day outstation journeys with dedicated luxury vehicles & personal chauffeur service across India.</p>
        </div>

        <!-- Features Grid -->
        <div class="features-grid">
            <div class="feature-box">
                <i class="fas fa-user-shield"></i>
                <span>Verified Drivers</span>
            </div>
            <div class="feature-box">
                <i class="fas fa-car-side"></i>
                <span>Clean & Sanitized</span>
            </div>
            <div class="feature-box">
                <i class="fas fa-tags"></i>
                <span>No Hidden Charges</span>
            </div>
            <div class="feature-box">
                <i class="fas fa-clock"></i>
                <span>24x7 Pickup Available</span>
            </div>
        </div>

        <!-- Booking Form Container -->
        <div class="form-card">
            <h2 class="form-title">Book Your Round Trip Ride</h2>
            
            <form id="roundTripForm" action="https://api.web3forms.com/submit" method="POST">
                <input type="hidden" name="access_key" value="e25951c5-279a-41b8-bc1a-94b7904ce297">
                <input type="hidden" name="subject" value="New Round Trip Booking - Shri Radha Travels">
                <input type="hidden" name="redirect" value="https://shriradhatravels.com/thank-you.html">

                <div class="input-group">
                    <input type="text" name="Pickup_Location" placeholder="Pickup City / Location" required>
                </div>

                <div class="input-group">
                    <input type="text" name="Destination" placeholder="Destination City(s)" required>
                </div>

                <div class="input-group">
                    <input type="date" name="Pickup_Date" required style="color: #94a3b8;" onchange="this.style.color='#fff'">
                </div>

                <div class="input-group">
                    <input type="date" name="Return_Date" required style="color: #94a3b8;" onchange="this.style.color='#fff'">
                </div>

                <div class="input-group">
                    <select name="Vehicle_Type" required>
                        <option value="" disabled selected>Select Vehicle Class</option>
                        <option value="Hatchback - Glanza">Hatchback (Glanza / Swift)</option>
                        <option value="Sedan - Dzire">Sedan (Swift Dzire / Etios)</option>
                        <option value="SUV - Ertiga">SUV (Maruti Ertiga / XL6)</option>
                        <option value="Luxury MPV - Innova Crysta">Luxury MPV (Innova Crysta)</option>
                        <option value="Tempo Traveller">Tempo Traveller (12 - 26 Seater)</option>
                    </select>
                </div>

                <div class="input-group">
                    <input type="tel" name="Phone_Number" placeholder="Enter Mobile Number" required>
                </div>

                <button type="submit" class="submit-btn">Reserve Round Trip Now</button>
            </form>
        </div>
    </div>

    <!-- Floating Action Stack -->
    <div class="floating-stack">
        <a href="https://wa.me/916280544730?text=Hello,%20I%20want%20to%20book%20a%20Round%20Trip%20Cab." target="_blank" class="float-btn btn-wa">
            <i class="fab fa-whatsapp"></i>
        </a>
        <a href="tel:+916280544730" class="float-btn btn-call">
            <i class="fas fa-phone-alt"></i>
        </a>
    </div>

</body>
</html>
